- aid: 4paradigm-openmldb-apiserver
  image: https://raw.githubusercontent.com/4paradigm/OpenMLDB/main/docs/zh/about/images/openmldb_logo.png
  name: OpenMLDB APIServer REST API
  description: >-
    The HTTP/JSON surface of OpenMLDB's optional APIServer module — insert rows into a
    table, invoke a deployed real-time feature-computation service, run online/offline SQL,
    read deployment and table metadata, and refresh the metadata cache. OpenMLDB is
    self-hosted, so the base URL is whatever host the operator runs APIServer on; the
    provider's own examples use http://127.0.0.1:8080.
  humanURL: https://openmldb.ai/docs/en/main/quickstart/sdk/rest_api.html
  baseURL: http://127.0.0.1:8080
  tags:
  - Machine Learning
  - Feature Store
