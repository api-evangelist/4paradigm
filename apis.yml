aid: 4paradigm
name: 4Paradigm
description: >-
  4Paradigm (Beijing Fourth Paradigm Intelligent Technology, HKEX 6682) is a Chinese
  enterprise AI company building decision-making and generative AI platforms — the Sage
  AIOS AI operating system, Sage HyperCycle ML/CV/OCR, SageGPT and the SageOne AI
  computing appliances — for banking, insurance, securities, retail, energy, healthcare
  and manufacturing. Its public, machine-readable API surface is published almost
  entirely through its open-source community at github.com/4paradigm: OpenMLDB, an
  Apache-2.0 machine-learning feature database with a documented REST APIServer,
  Protobuf/brpc cluster services and Java/Python/Go/C++ SDKs; OpenAIOS-Platform
  (Pineapple), a Kubernetes-based AI development platform that ships OpenAPI 3.0.3
  contracts; and PhanthyMotus, an MCP-native embodied-AI agent framework whose hardware
  drivers are Model Context Protocol servers.
