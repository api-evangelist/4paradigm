- aid: 4paradigm-phanthymotus
  image: https://www.4paradigm.com/images/logo.png
  name: PhanthyMotus Agent Core and Driver MCP Bus
  description: >-
    PhanthyMotus is 4Paradigm's open-source embodied-AI agent framework. Every hardware
    driver bundle is a Model Context Protocol server exposing typed cards — sensor,
    actuator, processor and resource — which the Agent Core consumes over a unified MCP
    data bus. Sixteen driver bundles are published with machine-readable driver.yaml
    manifests declaring the MCP URL and the cards each bundle exposes.
  humanURL: https://motus.phanthy.com/en/drivers
  baseURL: http://localhost:15678
  tags:
