- aid: 4paradigm-sage-app-store
  image: https://www.4paradigm.com/images/logo.png
  name: Sage App Store Catalogue API
  description: >-
    The read-only JSON API behind 4Paradigm's Sage App Store — the model catalogue (62 AI models with
    version, category and short description), the self-referencing category tree, the solutions list,
    the featured-highlights set and the home-page banners. Undocumented and unadvertised, but live,
    unauthenticated and answering on the public internet: the only 4Paradigm API surface in this record
    that an agent can call today without deploying anything.
  humanURL: https://apps.4paradigm.com/
