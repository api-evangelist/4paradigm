    title: Who is on the other end, why trust it, what may it do — the multi-robot peer mesh
    breaking: false
    highlights: >-
      Key-based peer identity, six-digit pairing, requests signed against a pinned key, three
      authorisation gates before a peer can move anything. Discloses two of its own defects: a
      keyword-based permission check that let a read-only peer drive locomotion, and a safety config
      flag read by no code.
