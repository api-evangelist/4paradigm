  lifecycle: lifecycle/4paradigm-lifecycle.yml
  authentication: authentication/4paradigm-authentication.yml
  rate_limits: rate-limits/4paradigm-rate-limits.yml
  data_model: data-model/4paradigm-data-model.yml
