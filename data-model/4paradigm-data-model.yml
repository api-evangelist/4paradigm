  openapi/, plus live JSON shapes probed on https://apps.4paradigm.com/api/ on 2026-09-05
name: 4Paradigm data model
note: Three disconnected graphs, not one. OpenAIOS-Platform models a Kubernetes AI workspace (environments,
  applications, Helm releases, charts, images, storage, compute units); the Sage App Store models a product
  catalogue; OpenMLDB's model is SQL itself — databases, tables, indexes, deployments and jobs — declared
  in DDL statements rather than in JSON Schema, so it has no component schemas to derive from. No shared
  identifier crosses any two of them.
id_conventions:
  style: name-in-path
  note: OpenAIOS-Platform addresses almost everything by NAME in the path (/environments/{name}, /applications/{name},
    /releases/{name}); only billing uses an opaque id ({userid}, {computeunit_id}). There is no prefixed-id
    scheme anywhere.
