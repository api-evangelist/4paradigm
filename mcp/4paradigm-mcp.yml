generated: '2026-09-05'
method: searched
source: https://github.com/4paradigm/phanthymotus-driver — the driver.yaml manifest of each of the 16
  published bundles, fetched verbatim 2026-09-05; framework description from https://github.com/4paradigm/phanthymotus#readme
  and the resource centre at https://motus.phanthy.com/en/drivers
name: PhanthyMotus driver MCP bus
status: published
summary: 'PhanthyMotus is 4Paradigm''s open-source embodied-AI agent framework, and it is MCP-native by
  design: ''one MCP server per device''. Each hardware driver bundle runs as its own MCP server on a fixed
  localhost port and declares typed cards — sensor (data streams), actuator (executable actions), processor
  (data transforms) and resource (static assets such as URDF) — which the Agent Core discovers over a
  unified MCP data bus. 16 bundles are published with machine-readable driver.yaml manifests declaring
  303 cards in total.'
deployment:
  mode: local-stdio
  endpoint: null
  install: curl -fsSL https://motus.phanthy.com/install.sh | sudo bash
  package: https://github.com/4paradigm/phanthymotus-driver
  auth: none
  verified: searched
  note: 'mode is local-stdio in the sense the field draws — nothing here is reachable by an agent until
    a human installs and runs it on a machine attached to the robot. The transport is NOT stdio: each
    driver serves streamable-HTTP MCP at http://localhost:<port>/mcp once its container is running, as
    its own driver.yaml states. 4Paradigm operates no hosted/remote MCP endpoint, so no endpoint URL is
    recorded — the localhost URLs below are the provider''s declared local bind addresses, not an agent-callable
    service. Images are pulled from bj-warehouse.tencentcloudcr.com/phanthy-motus/.'
agent_core:
  port: 15678
  role: MCP client and agent loop (FastAPI + ros2_bridge), also the web dashboard
  perception_ports:
  - 15720
  - 15721
  actucore_port: 15730
  source: https://github.com/4paradigm/phanthymotus#readme
card_types:
  sensor: data streams the agent can read
  actuator: executable actions the agent can invoke
  processor: data transforms
  resource: static assets such as URDF models
