name: 4Paradigm MCP tool to REST operation crosswalk
summary: 'The crosswalk is deliberately EMPTY, and that is the finding. 4Paradigm publishes an MCP surface
  and an OpenAPI surface, but they belong to two unrelated products: the MCP cards are PhanthyMotus robot
  hardware capabilities, and the OpenAPI operations are OpenAIOS-Platform Kubernetes/AI-platform management
  calls. No card is backed by a published REST operation, and no operation is exposed as a tool. Nothing
  was mapped by name similarity — a binding invented across two different products would be worse than
  none.'
surfaces:
  openapi:
  - file: openapi/4paradigm-openaios-billing.yaml
    gated: false
  - file: openapi/4paradigm-openaios-platform-internal.yaml
    gated: false
  - file: openapi/4paradigm-openaios-platform.yaml
    gated: false
  - file: openapi/4paradigm-openaios-webterminal.yaml
    gated: false
  graphql: null
  mcp:
    url: http://localhost:<port>/mcp per driver bundle
    gated: true
    note: self-hosted; live tools/list requires the driver container and its hardware to be running, so
      per-tool inputSchemas could not be introspected
