name: 4Paradigm client libraries and distributions
note: >-
  4Paradigm publishes no SDK for its commercial Sage products; every first-party client
  library below belongs to its open-source projects (OpenMLDB, OpenAIOS, PhanthyMotus).
  Currency is the headline finding: the OpenMLDB SDKs on PyPI, Docker Hub and pkg.go.dev
  have not shipped a release since 2024, and the only 2025+ movement in the family is an
  unreleased 1.6.0-pre build on Maven Central. PhanthyMotus, by contrast, ships images
  daily but distributes them ONLY as OCI images on a Tencent Cloud registry — there is no
  package-registry entry for it at all.
