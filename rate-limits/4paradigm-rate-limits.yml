- control: Compute-unit quota
  surface: OpenAIOS Platform Billing API
  detail: >-
    Compute units are assigned per user and per group and priced (GET /computeunit/price), so an
    operator can cap consumption by account. This is a metering and chargeback mechanism, not a request
    rate limit, and the caps are set by the operator rather than published by 4Paradigm.
