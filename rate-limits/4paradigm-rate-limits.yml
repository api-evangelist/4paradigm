note: >-
  No rate limits are published, and none would be meaningful: every 4Paradigm API surface in this
  record is self-hosted software the operator runs on its own infrastructure, so the only ceiling is
  the deployment's own capacity. Nothing throttles at 4Paradigm's edge because 4Paradigm operates no
  edge. There is also no rate-limit signalling to consume — no X-RateLimit-*, no RateLimit-*, no
  Retry-After, and no 429 declared in any of the 57 REST operations or 140 RPCs.
